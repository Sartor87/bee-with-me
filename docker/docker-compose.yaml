# Fixed project name: the scripts find the db container by this label, whatever the folder is called.
name: bee-with-me

services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    # Comes back by itself after a reboot, a power loss, or a Docker Desktop restart —
    # discovering the database is down is not something you want to do during a callout.
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../data/pgdata:/var/lib/postgresql/data
    # Loopback only: the backend, the hardware reader and the scripts all run on this machine.
    # To reach the database from another machine, change this binding deliberately.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  tiles:
    image: maptiler/tileserver-gl:latest
    restart: unless-stopped
    volumes:
      - ../tiles:/data
    ports:
      - "127.0.0.1:8080:8080"
    command: --no-config --port 8080
